[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organpfnm"
version = "1.0.0"
description = "OrganPFN-M organ-age prediction, PIOAA, and organ aging-disease cascade analyses"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "einops>=0.7",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14",
  "scipy>=1.11,<2",
  "torch>=2.3",
]

[project.optional-dependencies]
training = ["tabpfn>=6.3.2,<7"]
cascade = ["lifelines>=0.30", "networkx>=3.2"]
test = ["pytest>=8", "pytest-cov>=5"]
all = [
  "tabpfn>=6.3.2,<7",
  "lifelines>=0.30",
  "networkx>=3.2",
  "pytest>=8",
  "pytest-cov>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
